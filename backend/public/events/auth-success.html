        </div>
        <div id="loading-status" class="p-4 bg-blue-900/20 border border-blue-500/30 rounded-lg text-blue-400 flex items-center gap-3">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Authenticated User</label>
                        <span id="discord-user-summary" class="block w-full p-2.5 bg-gray-900 border border-gray-700 text-gray-300 rounded-lg text-sm">Not logged in</span>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Event Name</label>
                        <select id="submit-eventname" class="w-full p-2.5 bg-gray-900 border border-gray-700 text-gray-50 rounded-lg outline-none focus:border-amber-500"></select>
                    </div>
                    <button id="submit-deck-button" type="button" class="bg-amber-600 hover:bg-amber-500 disabled:bg-gray-600 disabled:text-gray-400 text-white font-bold py-2.5 px-6 rounded-lg transition-colors">
                        Submit Deck
                    </button>
                </form>
                <p id="submit-status" class="text-sm font-semibold text-center md:text-left text-amber-400 mt-3"></p>
            </div>
