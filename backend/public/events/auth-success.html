
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby (v2.0) - Auth Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #e5e7eb; }
        .card-container {
            border: 4px solid #1f2937;
            background: linear-gradient(145deg, #1f2937, #111827);
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #1f2937; }
        textarea::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="p-4 md:p-8">
    <script>
        window.BACKEND_URL = "https://warlord-sots-deck-checker-production.up.railway.app";
    </script>
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-700 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-amber-500 tracking-tight">Bobby 2.0</h1>
                <p class="text-gray-400 text-sm mt-1">Validate deck legality for various formats.</p>
            </div>
            <div class="flex items-center gap-3 bg-gray-800/50 p-2 rounded-lg border border-gray-700">
                <span id="discord-user-info" class="text-sm font-medium text-gray-300"></span>
                <button id="discord-login-btn" class="bg-[#5865F2] hover:bg-[#4752C4] text-white text-xs font-bold py-2 px-3 rounded transition-colors">
                    Log in with Discord
                </button>
            </div>
            <div id="user-decks-section" class="mt-4"></div>
        </div>
        <div id="loading-status" class="p-4 bg-blue-900/20 border border-blue-500/30 rounded-lg text-blue-400 flex items-center gap-3">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading card database and rulesets...
        </div>
        <div id="input-section" class="hidden space-y-6"></div>
    </div>
    <script>
        async function fetchDiscordUser() {
            try {
                const res = await fetch('/api/auth/success', { credentials: 'include' });
                if (res.ok) {
                    const user = await res.json();
                    window.discordUser = user;
                    document.getElementById('discord-user-info').innerHTML = `Welcome, <b>${user.displayName || user.username}</b>!`;
                    document.getElementById('discord-login-btn').style.display = 'none';
                    fetchUserDecks();
                } else {
                    window.discordUser = null;
                    document.getElementById('discord-user-info').innerHTML = '<p>Could not load user info. Please log in again.</p>';
                    document.getElementById('discord-login-btn').style.display = '';
                }
            } catch (e) {
                window.discordUser = null;
                document.getElementById('discord-user-info').innerHTML = '<p>Could not load user info. Please log in again.</p>';
                document.getElementById('discord-login-btn').style.display = '';
            }
        }
        async function fetchUserDecks() {
            const section = document.getElementById('user-decks-section');
            section.innerHTML = '';
            try {
                const res = await fetch('/api/all-decks', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();
                if (!data.events || !Array.isArray(data.events) || data.events.length === 0) {
                    section.innerHTML = '<div class="bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-400 text-sm">No deck submissions found for active events.</div>';
                    return;
                }
                const user = window.discordUser;
                if (!user || !user.username) {
                    section.innerHTML = '<div class="bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-400 text-sm">Not logged in.</div>';
                    return;
                }
                const userId = user.id;
                const displayName = user.displayName ? user.displayName.toLowerCase() : null;
                let html = '<div class="bg-gray-900 border border-gray-700 rounded-lg p-4"><h3 class="text-lg font-bold text-amber-400 mb-2">Your Submitted Decks</h3>';
                html += '<ul class="space-y-3">';
                let found = false;
                for (const ev of data.events) {
                    const userDecks = (ev.decks || []).filter(d => {
                        if (typeof d.username === 'string' && d.username === userId) return true;
                        if (displayName && typeof d.display_name === 'string' && d.display_name.toLowerCase() === displayName) return true;
                        return false;
                    });
                    for (const deck of userDecks) {
                        found = true;
                        html += `<li class="border-b border-gray-700 pb-2 mb-2"><span class="font-semibold text-blue-300">${ev.eventName}</span><br>`;
                        html += '<span class="text-gray-300">Deck:</span><ul class="ml-4 mt-1">';
                        for (const [key, value] of Object.entries(deck)) {
                            if (typeof value === 'string' && key !== 'discordId') {
                                html += `<li class="text-xs text-gray-400"><span class="font-semibold text-gray-200">${key}:</span> ${value}</li>`;
                            }
                        }
                        html += '</ul></li>';
                    }
                }
                html += '</ul></div>';
                if (!found) {
                    section.innerHTML = '<div class="bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-400 text-sm">No deck submissions found for your account.</div>';
                } else {
                    section.innerHTML = html;
                }
            } catch (e) {
                section.innerHTML = '<div class="bg-gray-900 border border-gray-700 rounded-lg p-4 text-red-400 text-sm">Failed to load submitted decks.</div>';
            }
        }
        document.getElementById('discord-login-btn').addEventListener('click', function() {
            window.location.href = '/api/auth/discord?redirect=/test/auth-success';
        });
        fetchDiscordUser();
    </script>
</body>
</html>
